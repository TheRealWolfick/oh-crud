---
name: Condition Ratings
version: 1.1.2
table-name: condition_ratings
end-point: condition/rating
allow-diff: false

primary-key: condition_rating

end-points-allowed:
  GET: true
  PUT: true
  POST: true
  DELETE: true
  PUT-GROUP: true
  POST-GROUP: true
  DELETE-GROUP: true

fields:
  condition_rating:
    type: int
    json: condition_rating
    db-type: smallint
    required-on-insert: true
    include-in-diff: false
    rules:
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
  description:
    type: string
    json: description
    db-type: character varying(50)
    required-on-insert: true
    default: ""
    include-in-diff: true
    rules:
      enum:
        - short
        - long
  long_description:
    type: string
    json: long_description
    db-type: character varying(500)
    default: ""
    include-in-diff: true
