---
# Changelog:
#   1.2.2 — new table-level meta.table_role: supporting (see the multi-table
#           ledger's table picker — a whitelist, not every non-internal
#           table by default).
name: Condition Ratings
version: 1.2.2
table-name: condition_ratings
end-point: condition/rating
allow-diff: false
meta:
  table_role: supporting

primary-key: condition_rating

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  condition_rating:
    type: int
    json: condition_rating
    db-type: smallint
    required-on-insert: true
    include-in-diff: false
  description:
    type: string
    json: description
    db-type: character varying(50)
    required-on-insert: true
    default: ""
    include-in-diff: true
  long_description:
    type: string
    json: long_description
    db-type: character varying(500)
    default: ""
    include-in-diff: true
