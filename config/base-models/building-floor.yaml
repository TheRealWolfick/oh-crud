---
name: Building Floor
version: 1.1.0
table-name: building_floor_combo
end-point: bfloor
allow-diff: false

primary-key: bfloor_id

end-points-allowed:
  GET: true
  PUT: true
  POST: true
  DELETE: true
  PUT-GROUP: true
  POST-GROUP: true
  DELETE-GROUP: true

fields:
  bfloor_id:
    type: int
    json: bfloor_id
    db-type: int
    skip-insert: true
  building:
    type: string
    json: building
    db-type: text
    required-on-insert: true
  floor:
    type: string
    json: floor
    db-type: text
    required-on-insert: true
    absolute-match: true
  is_active:
    type: bool
    json: is_active
    db-type: boolean
    default: "true"
