---
# Changelog:
#   1.2.3 — record `foreign-key-target-field-description: floor_description` on
#           fk_building_floor_floor. `floor_description` is a column of the
#           `floors` table (the FK target), so this is a direct descriptor:
#           it makes `floors.floor_description` the label origin for `floor`,
#           which then flows back through every table whose `floor` FK-links
#           here (building_floor_room_combo, and asset/data transitively).
#   1.2.2 — record `foreign-key-target-field-description: building_description`
#           on fk_building_floor_building so the FK descriptor graph can reach
#           a building label from a (building, floor) composite (asset/data's
#           building/floor/room cascade branches through here).
name: Building Floor
version: 1.2.3
table-name: building_floor_combo
end-point: bfloor
allow-diff: false

primary-key: bfloor_id

foreign-keys:
  fk_building_floor_building:
    foreign-key-fields:
      - building
    foreign-key-target-table: buildings
    foreign-key-target-fields:
      - building
    foreign-key-target-field-description: building_description
    foreign-key-on-update: CASCADE
  fk_building_floor_floor:
    foreign-key-fields:
      - floor
    foreign-key-target-table: floors
    foreign-key-target-fields:
      - floor
    foreign-key-target-field-description: floor_description
    foreign-key-on-update: CASCADE

unique-keys:
  uk_building_floor_bfloor:
    unique-key-fields:
      - building
      - floor

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  bfloor_id:
    type: int
    json: bfloor_id
    db-type: smallserial
    skip-insert: true
  building:
    type: string
    json: building
    db-type: character varying(15)
    required-on-insert: true
  floor:
    type: string
    json: floor
    db-type: character varying(4)
    required-on-insert: true
    absolute-match: true
  is_active:
    type: bool
    json: is_active
    db-type: boolean
    default: true
