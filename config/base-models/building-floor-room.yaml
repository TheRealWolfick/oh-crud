---
# Changelog:
#   1.7.0 — new field `audited_by` (db `character varying(60)`, nullable): the
#           username of whoever completed the room's most recent audit
#           (RBAC Stage 3a) — shown next to `date_audited` in the maps room
#           panel. Set alongside `date_audited` whenever "Complete audit"
#           runs; never user-editable directly. Schema delta: ADD COLUMN
#           audited_by character varying(60) — additive, no data loss.
#   1.6.0 — fk_building_floor_room_category: room_category -> room_categories
#           (category_code), carrying `foreign-key-target-field-description:
#           description` so the map's room-type picker shows each token's
#           description via the FK-constrained-editor plumbing. ON UPDATE
#           CASCADE / ON DELETE SET NULL. **Populate room_categories first**
#           (scripts/seed-room-categories.sql) — adding a FK over a column
#           that already has values is gated on the values reconciling.
#   1.5.0 — new field `room_category` (db `character varying(30)`, nullable):
#           the room-type token (CLINICAL, OFFICE, CORRIDOR, ...) the maps
#           area's typology base map colours rooms by. Set from the map's room
#           panel; when present it wins over the GeoJSON `category` property,
#           which in turn wins over the description-derived guess. Schema
#           delta: ADD COLUMN room_category character varying(30) — additive,
#           no data loss.
#   1.4.2 — record `foreign-key-target-field-description: floor_description` on
#           fk_building_floor_room_bfloor (describes its `floor` target field).
#           `floor_description` is NOT a column of the immediate target
#           (building_floor_combo) — it lives on `floors`, one hop further —
#           so the descriptor graph must follow the chain up to the origin
#           (see schema_catalog._resolve_edge). The declaration makes
#           building_floor_room_combo.floor (and any future FK into it) carry
#           the floors-origin label.
#   1.4.1 — `date_audited` drops its `now()` default: NULL now means "never
#           audited" (the DB is being reset to all-NULL). The maps area's
#           audit-completion analytics carry a dedicated never-audited bar.
#           Schema delta: ALTER COLUMN date_audited DROP DEFAULT — no data loss.
#   1.4.0 — new field `date_audited` (db `date`, nullable, default now()): when
#           this room was last physically audited. The maps area's "Audit"
#           density mode and audit-completion analytics read it. Schema delta:
#           ADD COLUMN date_audited date DEFAULT now() — additive, no data loss.
#   1.3.2 — record `foreign-key-target-field-description: dept_description` on
#           fk_building_floor_room_dept so the FK-constrained editor can show
#           the department name under the dept code without name-guessing.
#   1.8.0 — room audit rework. `room_category` now carries `meta.audit: true`
#           — the app's room audit flow reads this to add a "room type is
#           still correct" review item to every room's checklist, alongside
#           the per-asset audit:true fields on asset/data (see that
#           datamodel's 1.4.0 changelog entry and backend/app/room_audit.py).
#           New field `audit_data` (jsonb, nullable — no default; the app
#           treats a missing/null value as `{}`): holds the
#           results of user-defined custom audit checks (see the new
#           audit_check_definition table) that don't map onto any existing
#           column — e.g. a room-scoped "free from mould" yes/no, or a
#           "number of medical gas outlets" count. Keyed by check_id at the
#           top level; an asset-scoped custom check (one with no direct
#           asset/data field to write into) nests under a per-asset_no key
#           instead. Additive, non-destructive.
#   1.9.0 — audit channels. `room_category`'s `meta.audit` changes from a
#           bare `true` to a list of audit_channel codes (see asset-data.yaml
#           1.5.0's changelog entry for the same shape change) — tagged
#           `[ENGINEERING]` as a first pass, reassign if wrong before
#           deploying. DROP COLUMN `date_audited`, DROP COLUMN `audited_by`:
#           completion is now per-channel (audit_data.channels[code].
#           date_audited/audited_by, plus the append-only room_audit_log),
#           so one whole-room scalar date/by no longer means anything —
#           there is no single "the room's audit," only each channel's own.
#           Destructive: any existing date_audited/audited_by values are
#           lost. `audit_data`'s shape also changes — everything nests under
#           a per-channel key now (`audit_data.channels.<code>.{checks,
#           asset_checks, in_progress, complete, date_audited, audited_by}`)
#           instead of top-level `checks`/`asset_checks`/`in_progress` — see
#           backend/app/room_audit.py.
name: Building Floor Room
version: 1.9.0
table-name: building_floor_room_combo
end-point: room
allow-diff: false

primary-key: bfroom_id

foreign-keys:
  fk_building_floor_room_bfloor:
    foreign-key-fields:
      - building
      - floor
    foreign-key-target-table: building_floor_combo
    foreign-key-target-fields:
      - building
      - floor
    foreign-key-target-field-description: floor_description
    foreign-key-on-update: CASCADE
  fk_building_floor_room_dept:
    foreign-key-fields:
      - dept_code
    foreign-key-target-table: departments
    foreign-key-target-fields:
      - dept_code
    foreign-key-target-field-description: dept_description
    foreign-key-on-update: CASCADE
    foreign-key-on-delete: SET NULL
  fk_building_floor_room_category:
    foreign-key-fields:
      - room_category
    foreign-key-target-table: room_categories
    foreign-key-target-fields:
      - category_code
    foreign-key-target-field-description: description
    foreign-key-on-update: CASCADE
    foreign-key-on-delete: SET NULL

unique-keys:
  uk_building_floor_room_bfroom:
    unique-key-fields:
      - building
      - floor
      - room

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  bfroom_id:
    type: int
    json: bfroom_id
    db-type: serial
    skip-insert: true
  building:
    type: string
    json: building
    db-type: character varying(15)
    required-on-insert: true
  floor:
    type: string
    json: floor
    db-type: character varying(4)
    required-on-insert: true
    absolute-match: true
  room:
    type: string
    json: room
    db-type: character varying(15)
    required-on-insert: true
  room_description:
    type: string
    json: room_description
    db-type: character varying(100)
    default: ""
    nullable: true
  dept_code:
    type: string
    json: dept_code
    db-type: character varying(15)
    nullable: true
  room_category:
    type: string
    json: room_category
    db-type: character varying(30)
    nullable: true
    meta:
      audit:
        - ENGINEERING
  audit_data:
    type: json
    json: audit_data
    db-type: jsonb
    nullable: true
    description: >-
      Results of user-defined custom audit checks scoped to this room's
      category or to an asset category found in it (see the
      audit_check_definition table) that have no existing column of their
      own to write into — e.g. a room-scoped yes/no or a numeric count.
      Opaque to Oh CRUD; read/written only by the maps area's audit flow.
