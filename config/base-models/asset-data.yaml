---
# Changelog:
#   1.3.0 — add fk_asset_department: department -> departments.dept_code. The
#           column was already `required-on-insert` but unconstrained; the
#           editing UI needs a FK so it can offer only valid dept codes (no
#           hardcoded field lists — behaviour is driven off the datamodel).
#           Adding a FK to an existing populated column is gated behind Oh
#           CRUD's approval: assets carrying a department code not present in
#           `departments` must be reconciled first (a `distinct:department`
#           aggregate on asset/data vs. the departments table shows the gap).
#   1.3.1 — record `foreign-key-target-field-description` on every FK whose
#           target table has a human-readable descriptor column. The editing
#           UI uses it to show that description as a subheading under the code
#           value (in the combobox list and the committed value) instead of
#           guessing a description column by name. mh_locations has no such
#           column, so fk_asset_location carries none.
#   1.4.0 — room audit rework. New field `found` (bool, default false): was
#           this asset physically found during the room's most recent audit —
#           confirmed as part of every audit, alongside condition_rating/make/
#           model, which now all carry `meta.audit: true` (the app's room
#           audit flow reads that flag to know which fields it must have a
#           user confirm/edit per asset before that asset's audit can
#           complete — see backend/app/room_audit.py). `condition_rating` also
#           carries `meta.stamps_date_field: condition_rating_date`: the app
#           auto-sets that date to today whenever condition_rating is written
#           without the date ALSO given explicitly in the same write. `meta.
#           category` added to make/model/condition_rating/condition_rating_
#           date/found purely for UI grouping (no app behaviour keys off it
#           being a *specific* value — any string groups fields that share it).
#           Also records `meta.currency: true` on every dollar-value field
#           (disposal_cost, installation_cost, purchase_cost) so the editing
#           UI can format/enter them as currency instead of a plain float —
#           the mechanism already existed (see schema_catalog.py's Field.meta
#           docstring) but had never actually been set on these columns.
#           Additive, non-destructive.
#   1.5.0 — audit channels. `meta.audit` changes shape: instead of a bare
#           `true`, it's now a list of audit_channel codes this field belongs
#           to (a field belongs to exactly one channel in practice, but the
#           value is a list for forward compatibility with the datamodel
#           format). condition_rating/make/model/found are tagged
#           `audit: [ENGINEERING]` as a first pass, matching "Engineering
#           audits assets" — reassign before deploying if that's not the
#           right channel for these four. Additive, non-destructive (no
#           column change, only a meta-value shape change).
#   1.5.1 — reverted 1.5.0's `meta.audit` shape change: it's a bare `true`
#           again on condition_rating/make/model/found. In testing, binding
#           a built-in field to one hardcoded channel meant it only ever
#           showed up under an audit literally named "ENGINEERING" — these
#           fields are channel-agnostic, asked by every channel that audits
#           assets and reaches a matching asset (an empty/absent new
#           `meta.audit_categories` list means every category the owning
#           channel already reaches; set it to narrow a field to specific
#           categories, e.g. a hypothetical audited `refrigerant` field
#           restricted to `[RE-DR, RE-MR, ME-CU]`). Only a custom check's own
#           `channel_code` binds it to one channel — built-in fields never
#           do. No schema change, meta-value only.
#   1.6.0 — asset details modal. New table-level `meta.detail_categories`:
#           `{<name>: {order: N}}`, the ordered set of section headings the
#           maps area's asset details modal groups fields into (distinct from
#           the existing per-field `meta.category`, which is unrelated —
#           that one only groups the handful of `meta.audit`-flagged fields
#           for the room audit editor, under its own "Condition"/
#           "Identification" values). New per-field `meta.importance: 1`
#           marks a field for that modal — it shows every field so flagged,
#           grouped under its `meta.detail_category` (must name a key in the
#           table's `detail_categories`), and only categories that end up
#           with at least one shown field. New per-field `meta.alias`: an
#           optional display label override for that modal, for a field
#           whose humanised column name doesn't read naturally (e.g.
#           `purchase_order_no` -> "PO number", `working_life` -> "Working
#           life (yr)") — a field with no alias just shows its humanised
#           name. New per-field `meta.longtext`/`meta.date`, mirroring the
#           existing `meta.currency` convention, so the modal's editor can
#           pick a textarea / date input instead of guessing from the field
#           name. Additive, non-destructive — no column or behaviour change
#           for any existing consumer of these fields.
#   1.7.0 - Adds assset criticality rating and also links the status
#           to a new asset status table to build FK links with descriptions
#   1.7.1 - Re-enable asset_status FK now that values have been added to the target
#           table
#   1.7.2 - Fix criticality_rating's json name (was wrongly aliased to
#           condition_rating's, colliding the two fields' serialized keys).
#           New per-field meta.map_filter: true on asset_category,
#           condition_rating, department, make, manufacturer, model,
#           asset_status, and criticality_rating — the Maps area's Filters
#           panel is now schema-driven off this flag instead of a fixed,
#           hardcoded field list.
#   1.7.3 - Disposal behaviour. asset_status gets meta.stamps_date_field:
#           disposal_date, reusing condition_rating's existing auto-stamp
#           mechanism, but gated by a new meta.stamps_date_field_values:
#           ["D"] (a plain list of values, optional on any field using
#           stamps_date_field) so it only fires when the status is set to
#           Disposed, not on every status change. New meta.triggers: {<value>:
#           {label, fields: [...]}}: which fields the app should collect
#           through a dedicated modal before committing that value — asset_status
#           declares one for "D" listing disposal_date, condition_rating,
#           condition_rating_date, and disposal_reason. New meta.date: true
#           on disposal_date, matching condition_rating_date's convention.
#           Additive, non-destructive — no column or behaviour change for any
#           existing consumer of these fields or of condition_rating's own
#           unconditional stamp.
#   1.7.4 - New table-level meta.table_role: primary. Marks asset/data as the
#           app's one memory-resident, live-synced table for the new
#           multi-table ledger (every other catalogued table is "supporting"
#           — loaded on demand, dropped when the user navigates away). Purely
#           a UI/backend-caching hint Oh CRUD never reads; no column or
#           behaviour change.
#   1.7.5 - Remove 'found' field from diffs
#   1.7.6 - New per-field meta.copy: true, set on asset_no. Like the history
#           column, the app pins a "copy" button column right of the field;
#           clicking it opens a new entry (for asset/data, the add-asset
#           form) prefilled from that row with every field except the copy
#           field itself. Meta only — no column or behaviour change for Oh
#           CRUD.
#   1.8.0 - Ledger Grid "Add row" form (generic across tables, built from the
#           datamodel). New table-level meta.add_row: {title} — the form's
#           heading. New per-field meta.add: {section, order, default}:
#           section main|more|hidden places a field in the form (default:
#           required-without-a-DB-default -> main, json -> hidden, else
#           more), order sorts it within that section, default is its
#           starting value ("today" for a date). Here: the old Add asset
#           dialog's main column (asset no, location, category, description,
#           department, condition rating, purchase date) is reproduced,
#           domain is hidden (filled from the building pick), and status
#           starts at "A". Meta only — no column or behaviour change for Oh
#           CRUD.
name: Asset Data
version: 1.8.0
table-name: asset_data
end-point: asset/data
track-history: true
track-history-field: asset_no
allow-diff: true
diff-comparator: asset_no
meta:
  table_role: primary
  add_row:
    title: Add asset
  detail_categories:
    Identity: { order: 1 }
    Location: { order: 2 }
    Lifecycle: { order: 3 }
    Details: { order: 4 }
    Financial: { order: 5 }
admin-roles:
  - admin_assets

primary-key: asset_id

foreign-keys:
  fk_asset_department:
    foreign-key-fields:
      - department
    foreign-key-target-table: departments
    foreign-key-target-fields:
      - dept_code
    foreign-key-target-field-description: dept_description
    foreign-key-on-update: CASCADE
  fk_asset_assetcategory:
    foreign-key-fields:
      - asset_category
    foreign-key-target-table: asset_categories
    foreign-key-target-fields:
      - cat_code
    foreign-key-target-field-description: description
    foreign-key-on-update: CASCADE
  fk_asset_bfroom_combo:
    foreign-key-fields:
      - building
      - floor
      - room
    foreign-key-target-table: building_floor_room_combo
    foreign-key-target-fields:
      - building
      - floor
      - room
    foreign-key-target-field-description: room_description
    foreign-key-on-update: CASCADE
  fk_asset_building_domain:
    foreign-key-fields:
      - building
      - domain
    foreign-key-target-table: buildings
    foreign-key-target-fields:
      - building
      - db_domain
    foreign-key-target-field-description: building_description
    foreign-key-on-update: CASCADE
  fk_asset_conditionrating:
    foreign-key-fields:
      - condition_rating
    foreign-key-target-table: condition_ratings
    foreign-key-target-fields:
      - condition_rating
    foreign-key-target-field-description: description
    foreign-key-on-update: CASCADE
  fk_asset_location:
    foreign-key-fields:
      - mh_location
    foreign-key-target-table: mh_locations
    foreign-key-target-fields:
      - location
    foreign-key-on-update: CASCADE
    foreign-key-on-delete: SET NULL
  fk_assets_asset_status:
    foreign-key-fields:
      - asset_status
    foreign-key-target-table: asset_status
    foreign-key-target-fields:
      - asset_status
    foreign-key-target-field-description: status_description
    foreign-key-on-update: CASCADE
    foreign-key-on-delete: SET NULL
  fk_assets_criticality_rating:
    foreign-key-fields:
      - criticality_rating
    foreign-key-target-table: criticality_rating
    foreign-key-target-fields:
      - criticality_rating
    foreign-key-target-field-description: criticality_description
    foreign-key-on-update: CASCADE
    foreign-key-on-delete: SET NULL

unique-keys:
  uk_asset_asset_no:
    unique-key-fields:
      - asset_no

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  asset_id:
    type: int
    json: asset_id
    db-type: serial
    skip-insert: true
    include-in-diff: false
  added_date:
    type: string
    json: added_date
    db-type: timestamp without time zone
    default: "now()"
    include-in-diff: false
  additional_details:
    type: string
    json: additional_details
    db-type: text
    default: ""
    include-in-diff: false
    meta:
      importance: 1
      detail_category: Identity
      longtext: true
  asset_category:
    type: string
    json: asset_category
    db-type: character varying(20)
    required-on-insert: true
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 5 }
      importance: 1
      detail_category: Identity
      alias: Category
      map_filter: true
  asset_no:
    type: string
    json: asset_no
    db-type: character varying(40)
    required-on-insert: true
    include-in-diff: false
    meta:
      add: { section: main, order: 1 }
      importance: 1
      detail_category: Identity
      alias: "Asset no."
      copy: true
  asset_status:
    type: string
    json: asset_status
    db-type: char(1)
    default: "A"
    include-in-diff: true
    meta:
      add: { default: "A" }
      map_filter: true
      stamps_date_field: disposal_date
      stamps_date_field_values: ["D"]
      triggers:
        D:
          label: "Dispose asset"
          fields: [disposal_date, condition_rating, condition_rating_date, disposal_reason]
  building:
    type: string
    json: building
    db-type: character varying(15)
    required-on-insert: true
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 2 }
      importance: 1
      detail_category: Location
  condition_rating:
    type: int
    json: condition_rating
    db-type: smallint
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 8 }
      audit: true
      category: Condition
      stamps_date_field: condition_rating_date
      importance: 1
      detail_category: Lifecycle
      map_filter: true
  condition_rating_date:
    type: string
    json: condition_rating_date
    db-type: date
    nullable: true
    include-in-diff: true
    meta:
      category: Condition
      importance: 1
      detail_category: Lifecycle
      alias: Condition rated
      date: true
  contact_id:
    type: string
    json: contact_ID
    json-alias:
      - contact_id
    db-type: character varying(32)
    nullable: true
    include-in-diff: false
  criticality_rating:
    type: int
    json: criticality_rating
    db-type: smallint
    nullable: true
    include-in-diff: true
    meta:
      audit: true
      importance: 1
      detail_category: Identity
      map_filter: true
  department:
    type: string
    json: department
    db-type: character varying(15)
    required-on-insert: true
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 7 }
      importance: 1
      detail_category: Location
      map_filter: true
  description:
    type: string
    json: description
    db-type: character varying(150)
    required-on-insert: true
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 6 }
      importance: 1
      detail_category: Identity
      longtext: true
  disposal_cost:
    type: float
    json: disposal_cost
    db-type: numeric(10,2)
    nullable: true
    include-in-diff: true
    meta:
      currency: true
  disposal_date:
    type: string
    json: disposal_date
    db-type: date
    nullable: true
    include-in-diff: true
    meta:
      date: true
  disposal_reason:
    type: string
    json: disposal_reason
    db-type: character varying(200)
    nullable: true
    include-in-diff: true
  domain:
    type: string
    json: domain
    db-type: character varying(3)
    required-on-insert: true
    nullable: true
    include-in-diff: true
    meta:
      add: { section: hidden }
  finance_group_code:
    type: string
    json: finance_group_code
    db-type: character varying(5)
    nullable: true
    include-in-diff: false
  floor:
    type: string
    json: floor
    db-type: character varying(4)
    nullable: true
    absolute-match: true
    include-in-diff: true
    meta:
      add: { section: main, order: 3 }
      importance: 1
      detail_category: Location
  gl_asset_reference:
    type: string
    json: GL_asset_reference
    db-type: character varying(50)
    nullable: true
    include-in-diff: false
  install_date:
    type: string
    json: install_date
    db-type: date
    nullable: true
    include-in-diff: true
    meta:
      importance: 1
      detail_category: Lifecycle
      date: true
  installation_cost:
    type: float
    json: installation_cost
    db-type: numeric(10,2)
    nullable: true
    include-in-diff: true
    meta:
      currency: true
      importance: 1
      detail_category: Financial
  invoice_no:
    type: string
    json: invoice_no
    db-type: character varying(20)
    nullable: true
    include-in-diff: true
    meta:
      importance: 1
      detail_category: Financial
      alias: Invoice number
  is_virtual_asset:
    type: bool
    json: is_virtual_asset
    db-type: boolean
    default: "false"
    include-in-diff: false
  label_location:
    type: string
    json: label_location
    db-type: character varying(200)
    nullable: true
    include-in-diff: false
  latitude:
    type: float
    json: latitude
    db-type: numeric(9,6)
    nullable: true
    include-in-diff: true
  location:
    type: string
    json: location
    db-type: character varying(200)
    nullable: true
    include-in-diff: false
  longitude:
    type: float
    json: longitude
    db-type: numeric(9,6)
    nullable: true
    include-in-diff: true
  make:
    type: string
    json: make
    db-type: character varying(40)
    nullable: true
    include-in-diff: true
    meta:
      audit: true
      category: Identification
      importance: 1
      detail_category: Details
      map_filter: true
  manufacturer:
    type: string
    json: manufacturer
    db-type: character varying(40)
    nullable: true
    include-in-diff: false
    meta:
      map_filter: true
  mh_location:
    type: string
    json: mh_location
    db-type: character varying(40)
    nullable: true
  model:
    type: string
    json: model
    db-type: character varying(60)
    nullable: true
    include-in-diff: true
    meta:
      audit: true
      category: Identification
      importance: 1
      detail_category: Details
      map_filter: true
  owning_cost_center:
    type: string
    json: owning_cost_center
    db-type: character varying(10)
    nullable: true
    include-in-diff: true
  purchase_cost:
    type: float
    json: purchase_cost
    db-type: numeric(10,2)
    nullable: true
    include-in-diff: true
    meta:
      currency: true
      importance: 1
      detail_category: Financial
  purchase_date:
    type: string
    json: purchase_date
    db-type: date
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 9 }
      importance: 1
      detail_category: Financial
      date: true
  purchase_order_no:
    type: string
    json: purchase_order_no
    db-type: character varying(20)
    nullable: true
    include-in-diff: true
    meta:
      importance: 1
      detail_category: Financial
      alias: PO number
  purchasing_cost_center:
    type: string
    json: purchasing_cost_center
    db-type: character varying(10)
    nullable: true
    include-in-diff: true
  rfid_tag_id:
    type: string
    json: RFID_tag_ID
    db-type: character varying(36)
    nullable: true
    include-in-diff: false
  room:
    type: string
    json: room
    db-type: character varying(15)
    nullable: true
    include-in-diff: true
    meta:
      add: { section: main, order: 4 }
      importance: 1
      detail_category: Location
  serial:
    type: string
    json: serial
    db-type: character varying(40)
    nullable: true
    include-in-diff: true
    meta:
      importance: 1
      detail_category: Details
  service_agent:
    type: string
    json: service_agent
    db-type: character varying(40)
    nullable: true
    include-in-diff: false
  spare_parts:
    type: string
    json: spare_parts
    db-type: character varying(100)
    nullable: true
    include-in-diff: false
  spare_parts_bin_no:
    type: string
    json: spare_parts_bin_no
    db-type: character varying(40)
    nullable: true
    include-in-diff: false
  spare_parts_held:
    type: string
    json: spare_parts_held
    db-type: character varying(200)
    nullable: true
    include-in-diff: false
  supplier_code:
    type: string
    json: supplier_code
    db-type: character varying(20)
    nullable: true
    include-in-diff: true
  tech_manual_reference:
    type: string
    json: tech_manual_reference
    db-type: character varying(50)
    nullable: true
    include-in-diff: false
  user_defined_fields:
    type: json
    json: user_defined_fields
    db-type: jsonb
    nullable: true
    include-in-diff: false
  warranty_period:
    type: int
    json: warranty_period
    db-type: smallint
    include-in-diff: true
    nullable: true
    meta:
      importance: 1
      detail_category: Lifecycle
      alias: Warranty (mo)
  working_life:
    type: int
    json: working_life
    db-type: smallint
    nullable: true
    include-in-diff: true
    meta:
      importance: 1
      detail_category: Lifecycle
      alias: Working life (yr)
  ownership_status:
    type: string
    json: ownership_status
    db-type: character(1)
    default: "O"
    include-in-diff: true
    nullable: true
  altered_date:
    type: string
    json: altered_date
    db-type: timestamp without time zone
    default: "now()"
    include-in-diff: false
  refrigerant:
    type: string
    json: refrigerant
    db-type: character varying(10)
    nullable: true
    include-in-diff: false
    meta:
      importance: 1
      detail_category: Details
  refrigerant_grams:
    type: int
    json: refrigerant_quantity
    db-type: smallint
    nullable: true
    include-in-diff: false
    meta:
      importance: 1
      detail_category: Details
      alias: Refrigerant qty
  found:
    type: bool
    json: found
    db-type: boolean
    default: "false"
    nullable: true
    include-in-diff: false
    description: >-
      Confirmed as part of every room audit: was this asset physically
      present and located where the map/records say it is. Defaults to
      false for a newly added asset (not yet audited); set true or false
      each time the asset is checked off during a room audit.
    meta:
      audit: true
      category: Condition
