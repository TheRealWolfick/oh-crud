---
# Changelog:
#   1.2.4 — new table-level meta.table_role: supporting. Marks this as one
#           of the multi-table ledger's user-facing "supporting" tables
#           (see asset-data.yaml 1.7.4/1.7.5 and the ledger's table
#           picker) — a whitelist, not every non-internal table by
#           default. Purely a UI hint Oh CRUD never reads.
name: Asset Categories
version: 1.2.4
table-name: asset_categories
end-point: asset/category
allow-diff: false
meta:
  table_role: supporting

primary-key: cat_code

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  cat_code:
    type: string
    json: cat_code
    db-type: character varying(20)
    required-on-insert: true
  asset_system:
    type: string
    json: asset_system
    db-type: character varying(76)
    nullable: true
  asset_subsystem:
    type: string
    json: asset_subsystem
    db-type: character varying(76)
    nullable: true
  is_active:
    type: bool
    json: is_active
    db-type: boolean
    default: true
  description:
    type: string
    json: description
    db-type: character varying(60)
    default: ""
