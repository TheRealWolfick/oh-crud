---
# Changelog:
#   1.2.2 — record `foreign-key-target-field-description: building_description`
#           on fk_departments_building for the FK-constrained editor's
#           subheading. building_floor_combo has no descriptor column, so
#           fk_department_bfloor carries none.
#   1.3.0 — audit channels. New field `audit_data` (jsonb, nullable — no
#           default): mirrors building_floor_room_combo's audit_data exactly,
#           but for unit="department" audit channels — a department's rooms
#           can span multiple buildings/floors with no single room row to
#           hold this state, so it lives on the department itself instead.
#           Opaque to Oh CRUD; read/written only by the maps area's audit
#           flow (see audit-channel.yaml, department-audit-log.yaml).
#           Additive, non-destructive.
name: Department
version: 1.3.0
table-name: departments
end-point: department
allow-diff: false

primary-key: dept_code

foreign-keys:
  fk_departments_building:
    foreign-key-fields:
      - building
    foreign-key-target-table: buildings
    foreign-key-target-fields:
      - building
    foreign-key-target-field-description: building_description
    foreign-key-on-update: NO ACTION
  fk_department_bfloor:
    foreign-key-fields:
      - building
      - floor
    foreign-key-target-table: building_floor_combo
    foreign-key-target-fields:
      - building
      - floor
    foreign-key-on-update: CASCADE

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  dept_id:
    type: int
    json: dept_id
    db-type: serial
    nullable: true
    skip-insert: true
  dept_code:
    type: string
    json: dept_code
    db-type: character varying(15)
    required-on-insert: true
  description:
    type: string
    json: dept_description
    db-type: character varying(200)
    default: ""
  building:
    type: string
    json: building
    db-type: character varying(15)
    nullable: true
  floor:
    type: string
    json: floor
    db-type: character varying(4)
    nullable: true
    absolute-match: true
  is_active:
    type: bool
    json: is_active
    db-type: boolean
    default: true
  audit_data:
    type: json
    json: audit_data
    db-type: jsonb
    nullable: true
    description: >-
      Per-channel audit state for unit="department" audit channels (see
      audit-channel.yaml) — mirrors building_floor_room_combo.audit_data.
      Opaque to Oh CRUD; read/written only by the maps area's audit flow.
