---
name: Department
version: 1.1.0
table-name: departments
end-point: department
allow-diff: false

primary-key: dept_code

end-points-allowed:
  GET: true
  PUT: true
  POST: true
  DELETE: true
  PUT-GROUP: true
  POST-GROUP: true
  DELETE-GROUP: true

fields:
  dept_id:
    type: int
    json: dept_id
    db-type: int
    nullable: true
    skip-insert: true
  dept_code:
    type: string
    json: dept_code
    db-type: text
    required-on-insert: true
  description:
    type: string
    json: dept_description
    db-type: text
    default: ""
  building:
    type: string
    json: building
    db-type: text
    nullable: true
  floor:
    type: string
    json: floor
    db-type: text
    nullable: true
    absolute-match: true
  is_active:
    type: bool
    json: is_active
    db-type: boolean
    nullable: true
