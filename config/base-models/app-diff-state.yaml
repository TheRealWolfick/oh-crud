---
# The Diff Console's shared, cross-user resolution log — one row per diff
# checksum. This service holds the live copy in memory (diff_store.py); this
# table is the durable backing so a backend restart doesn't lose which
# resolutions were queued and, more importantly, which were already
# committed (locked). Without it, a diff that had been fully actioned before
# a reboot came back looking un-actioned.
#
# `payload` is JSONB — {"log": [<Action.to_dict()>...], "locked": [<id>...],
# "rev": <int>, "saved_at": <epoch>} — stored as a real JSON document, the same
# way asset/data's user_defined_fields is. One writer (single FastAPI replica),
# so last-write-wins is fine. The top-level `version` column mirrors the
# payload's `rev` so a cheap `GET ?fields=checksum,version` tells the backend
# what's persisted per checksum without pulling the payloads.
#
# Changelog:
#   1.2.0 — add `version` (int, default 0): the persisted rev of each row,
#           mirrors payload.rev. Additive column, non-destructive.
#   1.1.0 — `updated_at` no longer skip-insert: it is now `nullable`, `default`
#           now(), and the backend sends it (ISO8601) on every write. Under
#           1.0.0 (which used the invalid key `db-default`) the column was
#           NOT NULL with no default and Oh CRUD's insert path passed NULL, so
#           every insert failed with
#           'null value in column "updated_at" ... violates not-null constraint'.
#           Schema delta: ALTER COLUMN updated_at DROP NOT NULL + SET DEFAULT
#           now() — a constraint relaxation, no data loss, nothing dropped.
name: App Diff State
version: 1.2.0
table-name: app_diff_state
end-point: app/diffstate
allow-diff: false

primary-key: checksum

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  checksum:
    type: string
    json: checksum
    db-type: character varying(64)
    required-on-insert: true
  payload:
    type: json
    json: payload
    db-type: jsonb
    nullable: true
  version:
    type: int
    json: version
    db-type: integer
    default: 0
    nullable: true
  updated_by:
    type: string
    json: updated_by
    db-type: character varying(50)
    nullable: true
  updated_at:
    type: string
    json: updated_at
    db-type: timestamptz
    default: now()
    nullable: true
