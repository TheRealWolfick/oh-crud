---
# Changelog:
#   1.0.1 — new table-level meta.table_role: supporting (see the multi-table
#           ledger's table picker — a whitelist, not every non-internal
#           table by default).
name: Asset Status
version: 1.0.1
table-name: asset_status
end-point: asset/status
allow-diff: false
meta:
  table_role: supporting

primary-key: asset_status

end-points-allowed:
  GET: []
  PUT: []
  POST: []
  DELETE: []
  PUT-GROUP: []
  POST-GROUP: []
  DELETE-GROUP: []
  DIFF: []

fields:
  asset_status:
    type: string
    json: asset_status
    db-type: char(1)
    required-on-insert: true
    rules:
      pattern: "[A-Z]*"
  status_description:
    type: string
    json: status_description
    db-type: character varying(15)
    nullable: true
