# A table where encrypted credentials are stored. The encryption secret
# is to be stored securely on the production server
#
#

name: signing_keys
version: 1.0.1
table-name: signing_keys
end-point: ""
primary-key: kid

fields:
  kid:
    type: string
    db-type: character varying(32)
    json: kid
  public_key:
    type: byte
    db-type: bytea
    json: public_key
    rules:
      min: 32
      max: 32
  private_key:
    type: byte
    db-type: bytea
    json: private_key
    private: true
    rules:
      min: 92
      max: 92
  status:
    type: string
    db-type: character varying(15)
    json: status
  created_at:
    type: time
    db-type: timestamptz
    json: created_at
    default: now()
  activated_at:
    type: time
    db-type: timestamptz
    json: activated_at
    nullable: true
  retired_at:
    type: time
    db-type: timestamptz
    json: retired_at
    nullable: true


