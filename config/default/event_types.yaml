name: event_types
version: 1.0.0
table-name: event_types
end-point: ""
end-points-allowed:
  GET: true
  PUT: true
  POST: true
  DELETE: false
  PUT-GROUP: true
  POST-GROUP: true
  DELETE-GROUP: false

primary-key: event_type_id

unique-keys:
  uk_event_type_type:
    unique-key-fields:
      - type

fields:
  event_type_id:
    type: int
    json: ""
    db-type: smallserial
    skip-insert: true
  type:
    type: string
    json: type
    db-type: character varying(20)
    required-on-insert: true
  description:
    type: string
    json: description
    db-type: character varying(200)
    nullable: true
  
