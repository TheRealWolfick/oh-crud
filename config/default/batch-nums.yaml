name: batch_numbers
version: 1.1.2
table-name: batch_numbers
service: ohc
end-point: ""

primary-key: batch_id

unique-keys:
  uk_batch_numbers:
    unique-key-fields:
      - table_name
      - batch_number

fields:
  batch_id:
    type: int
    db-type: serial
    skip-insert: true
    json: batch_id
  table_name:
    type: string
    db-type: character varying(63)   # <service>_<table-name>: up to PostgreSQL's 63 characters
    required-on-insert: true
    json: table_name
  service:
    type: string
    db-type: character varying(32)   # the table's service; always passed by generate_batch_number
    json: service
  batch_number:
    type: int
    db-type: int
    required-on-insert: true
    json: batch_number
  generated_date:
    type: string
    db-type: timestamp without time zone
    default: now()
    json: batched_date
  generated_by:
    type: string
    db-type: character varying(64)
    json: generated_by
