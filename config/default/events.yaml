name: events
version: 1.3.0
table-name: events
service: ohc
description: "A table that records all the events that occur in the database, given that they are set to persist to the db."
meta:
  persist: true
  report: true
end-point: events
primary-key: event_id
end-points-allowed:
  GET: ["user","report"]
  DELETE: []

foreign-keys:
  fk_events_event_user:
    foreign-key-fields:
      - user
    foreign-key-target-table: users
    foreign-key-target-fields:
      - username
    foreign-key-on-update: CASCADE

fields:
  event_id:
    type: int
    json: event_id
    db-type: serial
    skip-insert: true
  action:
    type: string
    json: action
    db-type: character varying(15)
    default: "missing"
    required-on-insert: true
    description: "The action that the event is taking place. This is typically the CRUD action."
  status:
    type: string
    json: status
    default: "missing"
    db-type: character varying(10)
    description: "The status of the related action. Typically queued, start, success, warn, failed or error."
  service:
    type: string
    json: service
    db-type: character varying(32)
    nullable: true
    description: "The service that owns the topic. Null on events recorded before topics belonged to a service."
  topic:
    type: string
    json: topic
    db-type: character varying(128)
    nullable: true
    description: "The topic within the service: table:{end-point}, diff:{end-point} or func:{end-point}/{name}."
  log:
    type: json
    json: log
    json-alias:
      - event_log
    db-type: jsonb
    nullable: true
    description: "This is the events information."
  time:
    type: time
    json: event_time
    db-type: timestamp without time zone
    nullable: true
    default: now()
  user:
    type: string
    json: event_user
    db-type: character varying(64)
    nullable: true
