name: events
version: 1.2.5
table-name: events
end-point: events
primary-key: event_id
end-points-allowed:
  GET: ["user","report"]
  DELETE: []

foreign-keys:
  fk_events_event_user:
    foreign-key-fields:
      - user
    foreign-key-target-table: users
    foreign-key-target-fields:
      - username
    foreign-key-on-update: SET NULL

fields:
  event_id:
    type: int
    json: event_id
    db-type: serial
    skip-insert: true
  action:
    type: string
    json: action
    db-type: character varying(10)
    default: "missing"
    required-on-insert: true
  status:
    type: string
    json: status
    default: "missing"
    db-type: character varying(10)
  topic:
    type: string
    json: topic
    db-type: character varying(30)
    nullable: true
  log:
    type: json
    json: log
    json-alias:
      - event_log
    db-type: jsonb
    nullable: true
  time:
    type: time
    json: event_time
    db-type: timestamp without time zone
    nullable: true
    default: now()
  user:
    type: string
    json: event_user
    db-type: character varying(20)
    nullable: true
