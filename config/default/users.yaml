name: users
version: 1.2.1
table-name: users
end-point: user
primary-key: username

unique-keys:
  uk_users_api:
    unique-key-fields:
      - api_key

end-points-allowed:
  GET: []
  PUT: []
  POST: []
fields:
  username:
    type: string
    json: username
    json-alias:
      - user
    db-type: character varying(20)
    required-on-insert: true
  api_key:
    type: uuid
    json: ""
    db-type: uuid
    default: gen_random_uuid()
    private: true
  api_access:
    type: bool
    json: api_access
    db-type: boolean
    default: false
  email:
    type: string
    json: email
    db-type: character varying(40)
    required-on-insert: true
  mobile:
    type: string
    json: mobile
    json-alias:
      - mob
    db-type: character varying(40)
    required-on-insert: true
  date_created:
    type: time
    json: ""
    db-type: date
    default: now()
    private: true
  roles:
    type: string
    json: roles
    json-alias:
      - role
    db-type: character varying(240)
    default: "user"
