name: users
version: 2.0.0
table-name: users
end-point: user
primary-key: username

unique-keys:
  uk_users_username:
    unique-key-fields:
      - username

end-points-allowed:
  GET: []
  PUT: []
  POST: []

fields:
  id:
    type: string
    db-type: text
    json: id
    json-alias:
      - userid
    nullable: false
    required-on-insert: true
    absolute-match: true
  username:
    type: string
    json: username
    json-alias:
      - user
    db-type: character varying(20)
    nullable: true
  display_name:
    type: string
    db-type: text
    nullable: true
    json: display_name
  password_hash:
    type: string
    db-type: text
    nullable: true
    json: password_hash
    private: true
  totp_secret:
    type: byte
    db-type: bytea
    json: totp_secret
    private: true
    required-on-insert: false
  created_at:
    type: time
    json: created_at
    db-type: timestampz
    default: now()
    nullable: false
    private: true
    skip-insert: true
  disabled_at:
    type: time
    json: disabled_at
    db-type: timestampz
    private: true
    skip-insert: true
  roles:
    type: "[]string"
    json: roles
    json-alias:
      - role
    db-type: "text[]"
    default: "{}"
