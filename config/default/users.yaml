name: users
version: 2.1.1
table-name: users
service: ohc
end-point: user
primary-key: username

unique-keys:
  uk_users_username:
    unique-key-fields:
      - username
  # id is the token subject and refresh token owner, so it must identify one user
  uk_users_id:
    unique-key-fields:
      - id

end-points-allowed:
  GET: []
  PUT: []
  POST: []

fields:
  id:
    type: string
    db-type: text
    json: id
    json-alias:
      - userid
    nullable: false
    required-on-insert: true
    absolute-match: true
  username:
    type: string
    json: username
    json-alias:
      - user
    db-type: character varying(64)
    nullable: false
  display_name:
    type: string
    db-type: text
    nullable: true
    json: display_name
  password_hash:
    type: string
    db-type: text
    nullable: true
    json: password_hash
    private: true
  totp_secret:
    type: byte
    db-type: bytea
    json: totp_secret
    private: true
    nullable: true            # NULL: the user has no second factor set up
    required-on-insert: false
  created_at:
    type: time
    json: created_at
    db-type: timestamptz
    default: now()
    nullable: false
    private: true
    skip-insert: true
  disabled_at:
    type: time
    json: disabled_at
    db-type: timestamptz
    private: true
    nullable: true            # NULL: the user is not disabled
    skip-insert: true
  roles:
    type: "[]string"
    json: roles
    json-alias:
      - role
    db-type: "text[]"
    default: "{}"
