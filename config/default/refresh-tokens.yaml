name: refresh-tokens
version: 1.1.0
table-name: refresh_tokens
end-point: ""
service: ohc
primary-key: id

unique-keys:
  uk-refresh-tokens-tokenhash:
    unique-key-fields:
      - token_hash

indexes:
  family_id:
    index-fields:
      - family_id

fields:
  id:
    type: int
    db-type: bigserial
    json: id
    skip-insert: true
  token_hash:
    type: string
    db-type: text
    private: true
    nullable: false
    required-on-insert: true
  user_id:
    type: string
    db-type: text
    json: user_id
    required-on-insert: true
    nullable: false
  client_id:
    type: string
    db-type: text
    json: client_id
    nullable: false
    required-on-insert: true
  family_id:
    type: string
    db-type: text
    json: family_id
    nullable: false
    required-on-insert: true
  amr:
    type: "[]string"
    db-type: "text[]"
    json: amr
    default: "{}"
  expires_at:
    type: time
    db-type: timestamptz
    nullable: false
    json: expires_at
    required-on-insert: true
  # When the user authenticated interactively. Copied unchanged on each rotation so
  # step-up checks see the real login time. Null on rows from before it was recorded.
  auth_time:
    type: time
    db-type: timestamptz
    nullable: true
    json: auth_time
  used_at:
    type: time
    db-type: timestamptz
    nullable: true
    json: used_at
  revoked_at:
    type: time
    db-type: timestamptz
    nullable: true
    json: revoked_at
