<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Oh CRUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/sky.js" defer></script>
</head>
<body>
<main class="login">
  <canvas class="sky" data-sky="login" aria-hidden="true"></canvas>
  <section class="login-card" aria-labelledby="signin">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 22 15 9l10 7" stroke="#F59E5B" stroke-opacity=".6" stroke-width="1.4"></path><circle cx="7" cy="22" r="2.6" fill="#F59E5B"></circle><circle cx="15" cy="9" r="3.2" fill="#C2410C"></circle><circle cx="25" cy="16" r="2.2" fill="#F59E5B"></circle></svg>
      <span>Oh CRUD</span>
    </div>
    <h1 id="signin">Sign in</h1>
    {{if .Error}}<div class="login-error" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label class="flabel">Username
        <input class="field" name="username" autocomplete="username" required value="{{.Username}}" {{if not .Username}}autofocus{{end}}>
      </label>
      <label class="flabel">Password
        <input class="field" name="password" type="password" autocomplete="current-password" required {{if .Username}}autofocus{{end}}>
      </label>
      <label class="flabel">One-time code
        <input class="field mono" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
        <span class="login-hint">Leave empty if you don't use one.</span>
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>
