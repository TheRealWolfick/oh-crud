<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{.CSRF}}">
<title>Oh CRUD admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/sky.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Admin sections">
    <canvas class="sky" data-sky="side" aria-hidden="true"></canvas>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 22 15 9l10 7" stroke="#F59E5B" stroke-opacity=".6" stroke-width="1.4"></path><circle cx="7" cy="22" r="2.6" fill="#F59E5B"></circle><circle cx="15" cy="9" r="3.2" fill="#FFE8D6"></circle><circle cx="25" cy="16" r="2.2" fill="#F59E5B"></circle></svg>
      <span>Oh CRUD</span>
    </div>
    <button class="nav" data-tab="overview" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="5" rx="1.5"></rect><rect x="13" y="10" width="8" height="11" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect></svg>
      Overview
    </button>
    <button class="nav" data-tab="services" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
      Services
    </button>
    <button class="nav" data-tab="users" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-5-5.5"></path></svg>
      Users
    </button>
    <button class="nav" data-tab="audit" type="button">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      Audit log
    </button>
    <div class="me">
      <div class="me-row">
        <div class="avatar" id="me-initials"></div>
        <div class="me-name"><b id="me-name">{{.Username}}</b><span>{{.Roles}}</span></div>
      </div>
      <span class="me-factor">{{.Factor}}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button class="btn btn-sm" type="submit">Sign out</button>
      </form>
    </div>
  </nav>
  <main class="main" id="main">
    <canvas class="sky" data-sky="main" aria-hidden="true"></canvas>
    <div class="top">
      <form class="search" id="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label class="sr" for="search-q">Search</label>
        <input id="search-q" type="search" placeholder="Search users, or paste a request id">
      </form>
      <span class="today" id="today"></span>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<div id="drawer"></div>
<dialog id="dialog"></dialog>
<div class="toasts" id="toasts" role="status"></div>
</body>
</html>
